[project]
name = "macrostrat.column-utils"
version = "0.1.0"
description = "Utilities for Macrostrat columns, shared by ingestion and the API"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "geoalchemy2>=0.15.2,<1",
    "macrostrat.utils>=1.3.1,<2.0.0",
    "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
