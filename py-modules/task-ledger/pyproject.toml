[project]
name = "macrostrat.task-ledger"
version = "0.1.0"
description = "Macrostrat's record of management task runs, executed by macrostrat.task_runner"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "macrostrat.database>=4.2.0",
    "macrostrat.task_runner>=0.1.1,<0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]
