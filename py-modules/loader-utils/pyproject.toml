[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macrostrat.loader_utils"
version = "0.1.0"
description = "Load tabular and geospatial files into PostgreSQL tables, inferring their structure"
authors = [{ name = "Macrostrat" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "geopandas>=1.1.3,<2",
    "macrostrat.database>=4.7.0,<5",
    "macrostrat.utils>=1.3.3,<2",
    "polars>=1.42.0,<2",
    "psycopg>=3.0.0,<4",
    "pyogrio>=0.12.1,<0.13",
    "shapely>=2.1.0,<3",
    "sqlalchemy>=2.0.0,<3",
]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
