[project]
name = "macrostrat.schema"
version = "1.1.0"
description = "Schema management for Macrostrat's database"
authors = [
    { name = "Daven Quinn", email = "dev@davenquinn.com" },
    { name = "Matthew Westphall" },
    { name = "Amy Fromandi" }
]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "macrostrat.app-frame>=3.2.0,<4",
    # 4.6.0: template_database copies database-level settings and force-drop no
    # longer falls back to PGDATABASE. test_schema_drift depends on both.
    "macrostrat.database>=4.6.0,<5",
    "macrostrat.utils>=1.3.3,<2",
    "macrostrat.schema_management>=2.0.0,<3",
    "rich>=13,<16",
    "typer>=0.22,<0.27",
    "click>=8.1.0,<10",
    "pytest>=8.3.4,<9",
    "httpx>=0.28.1",
    "macrostrat.map-topology[topology]",
    "macrostrat.core"
]

[tool.uv.sources]
"macrostrat.core" = { path = "../core", editable = true }
"macrostrat.map-topology" = { path = "../map-topology", editable = true }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
