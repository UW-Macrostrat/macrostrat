[project]
name = "macrostrat.task-runner"
version = "0.1.0"
description = "Registered management tasks, run on the worker with live terminal output"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11"
readme = "README.md"
# Light by design: the API holds the task catalog without the code that runs it.
dependencies = [
    "macrostrat.database>=4.2.0",
    "pydantic>=2",
    "redis>=4.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]
