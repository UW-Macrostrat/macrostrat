[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macrostrat.map_utils"
version = "0.0.1"
description = "Lightweight map database + storage operations (no GIS dependencies)"
authors = [{ name = "Macrostrat" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "macrostrat.database>=4.0.0,<5",
    "psycopg[binary]>=3.0,<4",
    "minio>=7.2,<8",
]

# `macrostrat.map_utils.tasks` imports `macrostrat.task_runner`, deliberately
# undeclared: only `load_registry()`, in that package, loads this entry point,
# so the tileserver and other consumers of map-utils never carry the runner.
[project.entry-points."macrostrat.tasks"]
maps = "macrostrat.map_utils.tasks:TASKS"

[tool.uv.sources]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
