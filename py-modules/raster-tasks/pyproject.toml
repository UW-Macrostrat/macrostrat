[project]
name = "macrostrat.raster-tasks"
version = "0.1.0"
description = "Management tasks for the raster index"
authors = [{ name = "Macrostrat" }]
requires-python = ">=3.11"
readme = "README.md"
# Light by design: the API serves the task catalog; only the admin worker
# installs the `index` extra, which reads rasters.
dependencies = [
    "macrostrat.task-runner",
    "pydantic>=2",
]

[project.optional-dependencies]
index = [
    "macrostrat.raster_index[s3,footprints]>=0.5.0,<1",
    "rich>=13",
]

[project.entry-points."macrostrat.tasks"]
rasters = "macrostrat.raster_tasks:TASKS"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
"macrostrat.task-runner" = { path = "../task-runner", editable = true }
