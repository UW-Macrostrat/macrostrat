[project]
name = "macrostrat.column-ingestion"
version = "0.1.0"
description = "Ingestion utilities for Macrostrat columns"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = [
    "fastexcel>=0.16.0",
    "openpyxl>=3.1.5",
    # `rtcompat` extra: use the runtime-CPU-compatible Polars build. The default
    # wheel is compiled for AVX2/FMA; the worker pod can be scheduled onto a node
    # whose CPU lacks those, and the first Polars call then dies with SIGILL
    # (illegal instruction). rtcompat dispatches at runtime so it runs anywhere.
    "polars[rtcompat]>=1.36.1",
    "pydantic>=2.12.5",
    "typer>=0.25.0,<0.27",
    "macrostrat.utils>=1.3.1,<2.0.0",
    # 4.6.1: template_database no longer leaves the source database unusable
    # after cloning it, which the session-scoped source fixture relies on.
    "macrostrat.database>=4.6.1,<5.0.0",
    "macrostrat.core",
    "scipy>=1.17.1",
    "xlsxwriter>=3.2.9",
]

[tool.uv.sources]
"macrostrat.core" = { editable = true, path = "../core" }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
