[project]
name = "macrostrat.usage_stats_capture"
version = "0.1.0"
description = "Log-harvesting pipelines for Macrostrat usage statistics"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
# Pure library: no CLI framework, no configuration loader. Frontends supply a
# database, storage credentials and the hashing salt.
dependencies = [
    "macrostrat.database>=4.4.1,<5",
    "minio>=7.2.20",
    "pydantic>=2,<3",
    "zstandard>=0.25.0"
]

[dependency-groups]
dev = ["black>=24.8.0,<25"]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
