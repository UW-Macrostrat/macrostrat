[project]
name = "macrostrat.map-topology"
version = "0.1.0"
description = "Utilities to tile geologic maps globally"
authors = [{ name = "Daven Quinn", email = "code@davenquinn.com" }]
requires-python = ">=3.11"
readme = "README.md"
# The base install is the `bounds` library, which the API uses; the topology
# manager and its CLI need the `topology` extra.
dependencies = [
    "macrostrat.database>=4.2.0",
    "macrostrat.task-runner",
    "pydantic>=2",
]

[project.entry-points."macrostrat.tasks"]
topology = "macrostrat.map_topology.tasks:TASKS"

[project.optional-dependencies]
topology = [
    "macrostrat.core",
    "macrostrat.map_utils",
    "mapboard.topology-manager",
    "pytest>=8.3.4,<10",
]

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
"macrostrat.task-runner" = { path = "../task-runner", editable = true }
"mapboard.topology-manager" = { path = "../../submodules/topology-manager", editable = true }
"macrostrat.core" = { path = "../core", editable = true }
"macrostrat.map_utils" = { path = "../map-utils", editable = true }
