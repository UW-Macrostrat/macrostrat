[project]
name = "macrostrat.usage_stats"
version = "0.1.0"
description = "Harvest Macrostrat and Rockd usage statistics from access logs"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "macrostrat.usage_stats_capture",
    "macrostrat.core",
    "rich>=13,<16",
    "typer>=0.12,<0.27",
    "matplotlib>=3.9.2,<4",
    "polars>=1.42.0,<2"
]

# Reporting only. Kept out of the base install so the harvester image — which
# runs `capture` on a schedule and never plots — doesn't carry ~250 MB of
# plotting stack. The CLI depends on usage_stats[plot], so local use is
# unaffected.
[project.scripts]
usage-stats = "macrostrat.usage_stats:app"

[dependency-groups]
dev = ["black>=24.8.0,<25"]

[project.entry-points."macrostrat.subsystems"]
usage-stats = "macrostrat.usage_stats:app"

[tool.uv.sources]
"macrostrat.core" = { path = "../core", editable = true }
"macrostrat.usage_stats_capture" = { path = "../usage-stats-capture", editable = true }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
