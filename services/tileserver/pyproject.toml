[project]
name = "macrostrat.tileserver"
version = "3.1.2"
description = "Macrostrat tile server"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.11, <4"
dependencies = [
    "fastapi>=0.111.0,<0.140",
    "macrostrat.database>=4.5,<5",
    "sqlparse>=0.5.1,<0.6",
    "macrostrat.utils>=1.2.0,<2",
    "pytest>=7.2.1,<10",
    "python-dotenv>=1.0.0,<2",
    "typer>=0.12,<0.27",
    "uvicorn>=0.34.2,<0.50",
    # titiler 1.x ships as separate subpackages; the umbrella distribution
    # stopped at 0.25. Only `core` is used directly here — `titiler.mosaic`
    # arrives with macrostrat.raster_layers.
    "titiler.core>=1,<2",
    "httpx>=0.27.2,<0.28",
    "mapbox-vector-tile>=2.1.0,<3",
    "macrostrat.tileserver-utils",
    # Previously pulled in transitively through the vendored timvt fork; used
    # directly here, so declared directly now that the fork is gone.
    "buildpg>=0.4,<0.5",
    "asyncpg>=0.29,<0.31",
    "orjson>=3.9,<4",
    "pydantic-settings>=2.0,<3",
    "starlette-cramjam>=0.3,<0.5",
    "morecantile>=5.0,<8.0",
    "macrostrat.raster_index>=0.3.1,<1",
    "macrostrat.raster_layers>=0.3.2,<1",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "isort>=5.12.0,<6",
    "black>=24.8.0,<25",
    # Test dependencies. The integration fixtures spin up a PostGIS container
    # and restore a dump into it; the unit tests need none of that.
    "pytest>=8.0,<9",
    # A PostGIS container for the integration fixtures. Used directly rather
    # than via macrostrat.dinosaur, whose local-path sources would propagate
    # into this lock file and break the image build.
    "testcontainers>=4.8,<5",
]

[tool.uv]

[tool.uv.sources]
"macrostrat.tileserver_utils" = { path = "../../py-modules/tileserver-utils", editable = true }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "integration: requires Docker and a restored test database",
]


