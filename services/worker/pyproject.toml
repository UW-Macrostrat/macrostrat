[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macrostrat.worker"
version = "1.2.0"
description = "Celery task-queue app and workers for Macrostrat background jobs"
authors = [{ name = "Macrostrat" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.3,<6",
    # The image installs with pip from the index, with no lockfile, so this is
    # the only pin. SQLAlchemy 2.1 made `ScalarAttributeImpl` private and
    # sqlalchemy-utils (0.42.1, pulled in by macrostrat.database) still imports
    # it, so the worker fails at import. Drop once sqlalchemy-utils supports 2.1.
    "sqlalchemy<2.1",
]

[project.optional-dependencies]
maps = [
    "macrostrat.map_utils",
]
columns = [
    "macrostrat.column-ingestion",
]
tasks = [
    "macrostrat.task-ledger",
    "macrostrat.task_runner>=0.1.0,<0.2",
    "macrostrat.map-topology[topology]",
    "macrostrat.map_integration",
    "macrostrat.raster-tasks[index]",
]

[tool.uv.sources]
"macrostrat.map_utils" = { path = "../../py-modules/map-utils", editable = true }
"macrostrat.column-ingestion" = { path = "../../py-modules/column-ingestion", editable = true }
"macrostrat.task-ledger" = { path = "../../py-modules/task-ledger", editable = true }
"macrostrat.raster-tasks" = { path = "../../py-modules/raster-tasks", editable = true }
"macrostrat.map-topology" = { path = "../../py-modules/map-topology", editable = true }
"macrostrat.map_integration" = { path = "../../py-modules/map-integration", editable = true }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
