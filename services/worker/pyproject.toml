[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macrostrat.worker"
version = "0.0.1"
description = "Celery task-queue app and workers for Macrostrat background jobs"
authors = [{ name = "Macrostrat" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "celery[redis]>=5.3,<6",
    # The image installs with pip from the index, with no lockfile, so this is
    # the only pin. SQLAlchemy 2.1 made `ScalarAttributeImpl` private and
    # sqlalchemy-utils (0.42.1, pulled in by macrostrat.database) still imports
    # it, so the worker fails at import. Drop once sqlalchemy-utils supports 2.1.
    "sqlalchemy<2.1",
]

[project.optional-dependencies]
maps = [
    "macrostrat.map_utils",
]
columns = [
    "macrostrat.column-ingestion",
]

[tool.uv.sources]
"macrostrat.map_utils" = { path = "../../py-modules/map-utils", editable = true }
"macrostrat.column-ingestion" = { path = "../../py-modules/column-ingestion", editable = true }

[tool.hatch.build.targets.sdist]
include = ["macrostrat"]

[tool.hatch.build.targets.wheel]
include = ["macrostrat"]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
