[project]
name = "usage-stats-service"
version = "0.1.0"
description = "Deployed worker that harvests Macrostrat usage statistics from access logs"
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "macrostrat.usage_stats_capture",
]

[tool.uv.sources]
"macrostrat.usage_stats_capture" = { path = "../../py-modules/usage-stats-capture", editable = true }

[tool.hatch.build.targets.wheel]
include = ["usage_stats_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
