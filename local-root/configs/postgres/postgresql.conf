# Local overrides, layered on the config initdb generated in the data volume.
include_if_exists '/var/lib/postgresql/data/postgresql.conf'

listen_addresses = '*'
shared_preload_libraries = 'pgaudit'

# A runaway query should fail loudly, not fill the shared host disk and crash the server.
temp_file_limit = '10GB'
log_temp_files = '1GB'

shared_buffers = '2GB'

# Bulk map writes (e.g. noding) otherwise checkpoint every few seconds.
max_wal_size = '4GB'
checkpoint_timeout = '15min'
wal_compression = lz4
