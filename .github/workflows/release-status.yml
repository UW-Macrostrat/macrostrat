name: Release status

# Shows which services this pull request releases, and fails on a stable
# version without a changelog heading, or a stale uv.lock.

on:
  pull_request:
    branches: [main]

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Run mono on its own, without installing the workspace
      - name: Release plan and checks
        run: uvx --from "macrostrat.package_tools>=2.2.0,<3" mono status --check
