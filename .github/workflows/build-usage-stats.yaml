name: Build usage-stats worker
on:
  push:
    branches: ["main"]
    paths:
      - py-modules/usage-stats-capture/**
      - services/usage-stats/**
      - scripts/service-release
      - .github/workflows/build-service.yaml
      - .github/workflows/build-usage-stats.yaml
  pull_request:
    branches: ["main"]
    paths:
      - py-modules/usage-stats-capture/**
      - services/usage-stats/**
      - scripts/service-release
      - .github/workflows/build-service.yaml
      - .github/workflows/build-usage-stats.yaml
jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build-service.yaml
    with:
      service: usage-stats
      image: usage-stats
      # Repository root: the service depends on a library under py-modules/
      context: .
      file: services/usage-stats/Dockerfile
      platforms: linux/amd64
    secrets: inherit
